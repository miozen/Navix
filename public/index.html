<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mio-智能多功能响应式导航。提供高效的搜索、云端自定义网址管理、动态天气与专属壁纸等个性化功能。">
    <meta name="keywords" content="网址导航, Mio导航, 开发者导航, 智能导航, 响应式网站, 云端同步">

    <title id="page-title">Mio-智能多功能响应式导航</title>
    <link rel="icon" href="/favicon.ico" sizes="any">

    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="theme-dark font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 动态原生星空背景 (Canvas) -->
    <canvas id="starfield" class="fixed inset-0 w-full h-full pointer-events-none z-[-2] transition-opacity duration-700 opacity-100"></canvas>

    <!-- 个性化设置浮窗：入口按钮与面板同处左上角，面板紧贴按钮下方展开 -->
    <div class="fixed top-5 left-5 z-[150] relative">
        <button aria-label="打开设置面板" onclick="toggleThemeMenu(event)" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-400 hover:text-indigo-500 hover:scale-105 active:scale-95 transition-all shadow-lg cursor-pointer" title="打开设置面板（外观 / 站点 / 后台）">
            <i id="theme-icon" class="fas fa-palette text-sm"></i>
        </button>
        <div id="theme-panel" class="absolute left-0 top-full mt-2 w-[21.25rem] max-w-[calc(100vw-2.5rem)] max-h-[75vh] overflow-y-auto bg-slate-900/95 border border-slate-700/80 rounded-2xl shadow-2xl hidden backdrop-blur-md p-4 space-y-3 z-[160]" onclick="event.stopPropagation()">
            <div class="text-[10px] font-bold text-indigo-400 px-1 tracking-wider" data-i18n="sectionAppearance">外观 / APPEARANCE</div>
            <div class="text-[11px] font-bold text-slate-400 px-1" data-i18n="langTitle">语言 / Language</div>
            <div class="flex gap-2">
                <button onclick="setLanguage('zh')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">中文</button>
                <button onclick="setLanguage('en')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">English</button>
            </div>

            <div class="text-[11px] font-bold text-slate-400 px-1" data-i18n="themeTitle">基础色彩模式 (本地偏好)</div>
            <div class="flex gap-2">
                <button onclick="setBaseTheme('theme-light')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-sun text-amber-500"></i> <span data-i18n="themeLight">日间</span></button>
                <button onclick="setBaseTheme('theme-dark')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-moon text-indigo-400"></i> <span data-i18n="themeDark">夜间</span></button>
            </div>

            <div class="admin-only space-y-3 border-t border-slate-800 pt-3 mt-1">
                <div class="text-[10px] font-bold text-emerald-400 px-1 tracking-wider" data-i18n="sectionSite">站点设置 / SITE (仅管理员)</div>
                <div class="space-y-1.5 px-1">
                    <label class="text-[11px] text-slate-400 font-bold" data-i18n="siteTitleLabel">站点标题</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="site-title-input" placeholder="我的导航站" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                        <button onclick="applySiteSettings()" class="bg-indigo-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-indigo-500 cursor-pointer shrink-0" data-i18n="applyBtn">应用</button>
                    </div>
                </div>
                <div class="space-y-1.5 px-1">
                    <label class="text-[11px] text-slate-400 font-bold" data-i18n="footerTextLabel">页脚文字</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="footer-text-input" placeholder="© 2026 My Nav" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                        <button onclick="applySiteSettings()" class="bg-indigo-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-indigo-500 cursor-pointer shrink-0" data-i18n="applyBtn">应用</button>
                    </div>
                </div>
                <div class="space-y-1.5 px-1 border-t border-slate-800 pt-2">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] text-slate-400 font-bold" data-i18n="enginesLabel">搜索引擎</label>
                        <button onclick="resetEngines()" class="text-[10px] text-slate-400 hover:text-indigo-400 cursor-pointer" data-i18n="resetEngines">恢复默认</button>
                    </div>
                    <div id="engines-list" class="space-y-1.5"></div>
                    <button onclick="addEngine()" class="w-full py-1 rounded-lg border border-dashed border-slate-600 text-[11px] text-slate-400 hover:text-indigo-400 hover:border-indigo-500 cursor-pointer" data-i18n="addEngine">+ 添加引擎</button>
                    <button onclick="applySiteSettings()" class="w-full py-1.5 rounded-lg bg-indigo-600 text-white text-xs hover:bg-indigo-500 cursor-pointer" data-i18n="saveEngines">保存搜索引擎</button>
                </div>
            </div>

            <div class="admin-only space-y-3 border-t border-slate-800 pt-3 mt-1">
                <div class="text-[10px] font-bold text-rose-400 px-1 tracking-wider" data-i18n="sectionAdmin">后台 / ADMIN</div>
                <div class="space-y-1.5 px-1">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] text-slate-400 font-bold" data-i18n="bgTitle">自定义背景 (全站同步)</label>
                        <button onclick="clearCustomBg()" id="clear-bg-btn" class="text-[10px] text-red-400 hover:underline hidden" data-i18n="clearBg">清除壁纸</button>
                    </div>
                    <div class="flex gap-1.5">
                        <input type="text" id="custom-bg-input" data-i18n-placeholder="bgInputPlace" placeholder="输入图片网址 https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                        <button onclick="applyCustomBg()" class="bg-indigo-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-indigo-500 cursor-pointer shrink-0" data-i18n="applyBtn">应用</button>
                    </div>
                </div>
                <div class="space-y-1.5 px-1">
                    <label class="text-[11px] text-slate-400 font-bold" data-i18n="pwdTitle">修改管理员密码 (全站同步)</label>
                    <div class="flex gap-1.5">
                        <input type="password" id="custom-pwd-input" data-i18n-placeholder="pwdInputPlace" placeholder="输入新密码" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                        <button onclick="updateAdminPwd()" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-emerald-500 cursor-pointer shrink-0" data-i18n="saveBtn">保存</button>
                    </div>
                </div>
                <button onclick="logoutAdmin()" class="w-full py-1.5 rounded-lg bg-red-950/40 border border-red-900/40 text-red-400 text-[11px] text-center hover:bg-red-900/40 transition-colors cursor-pointer" data-i18n="logoutBtn">退出后台管理</button>
            </div>
        </div>
    </div>

    <!-- 主体区域 -->
    <div class="max-w-5xl mx-auto px-4 py-12 lg:py-20 flex flex-col items-center">

        <!-- 时间与问候语组件 -->
        <div id="hero-header" class="text-center mb-10 animate-fade-in">
            <h1 id="clock" class="text-5xl lg:text-7xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 mb-2">00:00:00</h1>
            <div class="flex items-center justify-center space-x-3 text-sm md:text-base font-medium tracking-wide opacity-90">
                <span id="greeting" class="text-indigo-400">正在筹备问候语...</span>
                <span class="opacity-30">|</span>
                <span id="weather-info" class="flex items-center gap-1.5 text-emerald-400">
                    <i class="fas fa-spinner fa-spin text-xs"></i> <span data-i18n="weatherLoading">正在定位测算天气...</span>
                </span>
            </div>
        </div>

        <!-- 搜索引擎组件 -->
        <div class="w-full max-w-2xl mb-16 relative z-[100]">
            <form id="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" class="relative">
                <div class="flex items-center glass-input rounded-2xl border border-slate-700/40 shadow-2xl focus-within:border-indigo-500/80 transition-all duration-300">
                    <div class="relative pl-4">
                        <button type="button" aria-label="切换搜索引擎" id="engine-btn" onclick="toggleEngineMenu(event)" class="flex items-center space-x-2 text-slate-400 hover:text-indigo-400 transition-colors py-4 pr-2 cursor-pointer">
                            <i id="engine-icon" class="fab fa-google text-blue-400"></i>
                            <i class="fas fa-chevron-down text-xs opacity-50"></i>
                        </button>
                        <div id="engine-menu" class="absolute left-2 top-full mt-2 w-36 bg-slate-950/95 border border-slate-800 rounded-xl shadow-2xl hidden backdrop-blur-md overflow-hidden z-[110]">
                            <button type="button" onclick="selectEngine('google')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-google text-blue-400"></i> <span data-i18n="enGoogle">谷歌 Google</span></button>
                            <button type="button" onclick="selectEngine('bing')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-microsoft text-teal-400"></i> <span data-i18n="enBing">必应 Bing</span></button>
                            <button type="button" onclick="selectEngine('baidu')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fas fa-paw text-red-400"></i> <span data-i18n="enBaidu">百度 Baidu</span></button>
                            <button type="button" onclick="selectEngine('github')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-github text-slate-400"></i> <span>GitHub</span></button>
                        </div>
                    </div>
                    <input type="text" id="search-input" name="q" data-i18n-placeholder="searchGoogle" placeholder="在 Google 中搜索..." autocomplete="off" class="w-full bg-transparent border-none py-4 px-3 focus:outline-none focus:ring-0 text-base">
                    <button type="submit" aria-label="搜索" class="mr-3 p-2.5 text-slate-400 hover:text-indigo-400 transition-colors">
                        <i class="fas fa-search text-lg"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- 导航卡片网格 -->
        <div id="main-nav-grid" class="w-full flex flex-col gap-6 mb-8 relative z-10">
            <!-- 添加动态分类按钮 (管理员可见) -->
            <div id="add-section-card" class="admin-only glass-card rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500/50 transition-all border-dashed border-2 border-slate-500/30 w-full" onclick="addCustomSection()" style="min-height: 100px;">
                <i class="fas fa-plus text-3xl text-slate-400 mb-2"></i>
                <span class="text-sm font-medium text-slate-400 mt-1" data-i18n="addSectionBtn">添加自定义区域</span>
            </div>
        </div>

        <!-- 友情链接区域 -->
        <div class="w-full relative z-10 mb-12">
            <div class="glass-card rounded-2xl p-6 shadow-xl hover:border-emerald-500/20 transition-all duration-300">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-semibold text-emerald-400 flex items-center"><i class="fas fa-handshake mr-2.5"></i> <span data-i18n="cardFriend">友情链接</span></h3>
                    <!-- 文本已修改为“添加 (云端)” -->
                    <button type="button" onclick="openLinkModal('friend')" class="admin-only text-xs px-2.5 py-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/20 rounded-lg hover:bg-emerald-600/40 transition-colors cursor-pointer z-[50]" data-i18n="addCloud">添加 (云端)</button>
                </div>
                <div id="friend-links-container" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3"></div>
            </div>
        </div>

        <footer id="admin-trigger" onclick="handleAdminTrigger()" class="text-slate-500 text-xs mt-4 cursor-pointer select-none tracking-wide hover:text-indigo-400/70 transition-colors" title="后台入口：点击登录 / 退出 (Click to login / logout)">
            <span data-i18n="footerText">&copy; 2026 Mio-智能生态导航 · Powered by Cloudflare</span> <span id="cloud-save-status" class="ml-1 text-[10px] hidden"></span> <span id="admin-badge" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-bold hidden" data-i18n="adminBadge">已登入</span>
        </footer>
    </div>

    <!-- 弹窗模态框 -->
    <div id="modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[300]" onclick="closeModalOnBlank(event)">
        <form class="bg-slate-900 border border-slate-700/80 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-slate-100" onclick="event.stopPropagation()" onsubmit="event.preventDefault(); saveActiveLink();">
            <h4 id="modal-title" class="text-md font-semibold text-slate-200 mb-4 flex items-center"><i class="fas fa-link mr-2 text-indigo-400"></i><span id="modal-title-text">添加网址</span></h4>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteName">网站名称</label>
                    <input type="text" id="site-name" data-i18n-placeholder="siteNamePlace" placeholder="例如：百度" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteUrl">网站网址 (URL)</label>
                    <input type="text" id="site-url" placeholder="www.baidu.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="toggleModal(false)" class="px-4 py-2 bg-slate-800 text-slate-400 text-xs font-medium rounded-xl hover:bg-slate-700 transition-colors cursor-pointer" data-i18n="btnCancel">取消</button>
                <button type="submit" id="modal-save-btn" class="px-4 py-2 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-500 transition-colors cursor-pointer shadow-lg shadow-indigo-600/20" data-i18n="btnSave">保存站点</button>
            </div>
        </form>
    </div>

    <!-- 管理员密码安全弹窗（登录 / 改密旧密码确认复用） -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[310]" onclick="closeAuthModalOnBlank(event)">
        <form class="bg-slate-900 border border-slate-700/80 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-slate-100" onclick="event.stopPropagation()" onsubmit="event.preventDefault(); submitAuthModal();">
            <h4 class="text-md font-semibold text-slate-200 mb-4 flex items-center">
                <i class="fas fa-lock mr-2 text-indigo-400"></i>
                <span id="auth-modal-title">管理员验证</span>
            </h4>
            <div class="mb-6">
                <label id="auth-modal-label" for="auth-modal-password" class="text-xs text-slate-400 block mb-1.5 font-medium">请输入后台管理员密码</label>
                <input type="password" id="auth-modal-password" autocomplete="current-password" placeholder="请输入密码" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="cancelAuthModal()" class="px-4 py-2 bg-slate-800 text-slate-400 text-xs font-medium rounded-xl hover:bg-slate-700 transition-colors cursor-pointer" data-i18n="btnCancel">取消</button>
                <button type="submit" id="auth-modal-submit" class="px-4 py-2 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-500 transition-colors cursor-pointer shadow-lg shadow-indigo-600/20">确认</button>
            </div>
        </form>
    </div>

    <!-- 回到顶部按钮（滚动到一定距离后显示） -->
    <button id="back-to-top" aria-label="回到顶部" onclick="scrollToTop()" title="回到顶部 / Back to Top"
        class="back-to-top fixed bottom-6 right-6 z-[140] w-11 h-11 rounded-full glass-card text-slate-300 hover:text-indigo-400 hover:scale-110 active:scale-95 transition-all duration-300 shadow-xl flex items-center justify-center pointer-events-none">
        <i class="fas fa-arrow-up text-sm"></i>
    </button>

    <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
