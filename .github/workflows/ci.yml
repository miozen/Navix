name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check (Worker + scripts + tests)
        run: |
          for f in $(find src scripts tests -name '*.mjs'); do
            node --check "$f"
          done

      - name: Run test suite
        run: node --test tests/*.test.mjs

      - name: Public boundary smoke
        run: node --test tests/smoke.test.mjs

      - name: No plaintext credentials in public config path
        run: |
          if grep -RniE 'admin888|(^|[^[:alnum:]_])adminPwd' src/ public/ wrangler.jsonc; then
            echo "发现明文凭据字段，请检查" >&2
            exit 1
          fi
